<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }} · juggling, sewing, drawing, videos{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#e0457b">
    <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
    <link rel="preload" href="{{ "fonts/fraunces-latin-700-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ "fonts/nunito-latin-400-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
    {{ $css := resources.Get "css/style.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
    {{ partial "opengraph.html" . }}
    {{ $img := .Params.image | default "images/mrs-lee-g.jpg" }}
    <meta property="og:image" content="{{ $img | absURL }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ $img | absURL }}">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    {{ partial "header.html" . }}
    <main id="main">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
</body>
</html>
